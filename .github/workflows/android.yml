name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$sdkmanager_path"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Run quality gates and assemble APKs
        run: ./gradlew --no-daemon clean check lintDebug testDebugUnitTest assembleDebug assembleRelease
      - name: Run Android instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb shell settings put global verifier_verify_adb_installs 0
            adb shell settings put global package_verifier_enable 0
            ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Verify APK outputs and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p app/build/verified
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk | tee app/build/verified/SHA256SUMS
          file app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indodaxsignal-apks-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/verified/SHA256SUMS
